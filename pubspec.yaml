name: lafz
description: "Lafz - Your chosen wisdom, beautifully delivered."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/content/
    - assets/content/baseline_content.json
    - assets/icon/
